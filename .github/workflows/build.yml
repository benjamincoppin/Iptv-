name: Compiler l'APK IPTV+

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.IPTV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iptvplus.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/iptvplus.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret IPTV_KEYSTORE_B64 absent : APK signé avec une clé de debug"
          fi

      - name: Clé TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ]; then
            KEY=$(printf '%s' "$TMDB_API_KEY" | tr -cd 'A-Za-z0-9._-')
            printf "window.IPTV_CONFIG = { tmdbKey: '%s' };\n" "$KEY" > app/src/main/assets/www/js/config.js
          else
            echo "::warning::Secret TMDB_API_KEY absent : images TMDB désactivées par défaut"
          fi

      - name: Compilation
        env:
          KEYSTORE_PASSWORD: ${{ secrets.IPTV_KEYSTORE_PASSWORD }}
          VCODE: ${{ github.run_number }}
        run: |
          export VCODE=$((VCODE + 2))
          export VNAME="1.1.$VCODE"
          gradle --no-daemon :app:assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/IPTVPlus-$VNAME.apk"
          cp app/build/outputs/apk/release/*.apk out/IPTVPlus.apk
          echo "VNAME=$VNAME" >> "$GITHUB_ENV"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPlus-apk
          path: out/*.apk
          retention-days: 30

      # Publish a release only when the APK is signed with the real key (updates install over the previous version)
      - name: Publication (Releases)
        if: env.KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VNAME }}
          name: IPTV+ ${{ env.VNAME }}
          make_latest: true
          files: |
            out/IPTVPlus.apk
            out/IPTVPlus-${{ env.VNAME }}.apk
