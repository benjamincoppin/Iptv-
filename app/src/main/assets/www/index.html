<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>IPTV+</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="logo">IPTV<span>+</span></div>
    <nav id="tabs" class="nav-group">
      <button class="f tab" data-route="home">Accueil</button>
      <button class="f tab" data-route="live">TV en direct</button>
      <button class="f tab" data-route="guide">Guide TV</button>
      <button class="f tab" data-route="movies">Films</button>
      <button class="f tab" data-route="series">Séries</button>
      <button class="f tab" data-route="favorites">Favoris</button>
    </nav>
    <div class="top-actions nav-group">
      <button class="f icon-btn" data-route="search" aria-label="Rechercher"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="f icon-btn" data-route="settings" aria-label="Paramètres"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
    </div>
  </header>
  <main id="page"></main>
  <nav id="bottombar">
    <button data-route="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg>Accueil</button>
    <button data-route="live"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>Direct</button>
    <button data-route="guide"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>Guide</button>
    <button data-route="movies"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 8h16M4 16h16"/></svg>Films</button>
    <button data-route="series"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Séries</button>
    <button data-route="favorites"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Favoris</button>
  </nav>
</div>
<div id="layer"></div>
<div id="toast"></div>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/sync.js"></script>
<script src="js/nav.js"></script>
<script src="js/player.js"></script>
<script src="js/live.js"></script>
<script src="js/guide.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
