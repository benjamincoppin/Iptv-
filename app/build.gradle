plugins {
    id 'com.android.application'
}

def ksPath = System.getenv('KEYSTORE_PATH')
def ksPass = System.getenv('KEYSTORE_PASSWORD') ?: 'iptvplus'

android {
    namespace 'com.iptvplus.player'
    compileSdk 36

    defaultConfig {
        applicationId 'com.iptvplus.player'
        minSdk 21
        targetSdk 34
        versionCode((System.getenv('VCODE') ?: '3') as int)
        versionName(System.getenv('VNAME') ?: '1.1.0')
        ndk {
            // ARM only: covers phones and Android TV boxes, keeps the APK smaller
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias 'iptvplus'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.7.6'
}
